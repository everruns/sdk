name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Which registry to publish to (a re-run after one registry failed)"
        type: choice
        options: [all, rust, python, typescript]
        default: all

permissions:
  contents: read

jobs:
  publish-rust:
    name: Publish Rust SDK
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'rust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify version matches tag
        if: github.event.release.tag_name != ''
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match rust/Cargo.toml ($CARGO_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - name: Publish to crates.io
        run: cd rust && cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-python:
    name: Publish Python SDK
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'python'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Verify version matches tag
        if: github.event.release.tag_name != ''
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PY_VERSION=$(grep '^version' python/pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$PY_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match python/pyproject.toml ($PY_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      - run: cd python && uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/

  publish-typescript:
    name: Publish TypeScript SDK
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'typescript'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) needs npm >= 11.5.1, which ships with Node 24.
          node-version: "24.22.1"
          registry-url: "https://registry.npmjs.org"

      - name: Verify version matches tag
        if: github.event.release.tag_name != ''
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          TS_VERSION=$(node -p "require('./typescript/package.json').version")
          if [ "$TAG_VERSION" != "$TS_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match typescript/package.json ($TS_VERSION)"
            exit 1
          fi
          echo "Version verified: $TAG_VERSION"

      # Trusted publishing: npm exchanges the job's OIDC token (id-token: write) for a
      # short-lived publish credential, so no NPM_TOKEN secret is needed, and attaches
      # provenance itself. The trusted publisher is configured on npmjs.com for
      # everruns/sdk, workflow publish.yml.
      - run: cd typescript && npm ci && npm run build && npm publish --access public
