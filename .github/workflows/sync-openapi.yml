name: Sync OpenAPI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install generator formatters
        run: |
          uv sync --project python --all-extras
          npm ci --prefix typescript

      - name: Sync OpenAPI and regenerate public SDK models
        run: python3 scripts/generate.py --sync-openapi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # PRs opened with the built-in GITHUB_TOKEN are refused (the org does not
      # let Actions create PRs) and would not trigger CI anyway, so the branch is
      # pushed with the built-in token and the PR is opened with the GitHub token
      # from Doppler. The token stays inside `doppler run`, never in GITHUB_ENV.
      - name: Install Doppler CLI
        if: steps.diff.outputs.changed == 'true'
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Push branch and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          BRANCH: chore/sync-openapi
          TITLE: "chore: sync OpenAPI spec and generated SDK models"
        run: |
          git config user.name "Mykhailo Chalyi"
          git config user.email "mike@chaliy.name"
          git checkout -B "$BRANCH"
          # Only tracked files: the Doppler CLI action drops its binary in ./bin.
          git add -u
          git commit -m "$TITLE"
          git push --force origin "$BRANCH"
          doppler run -- bash -c '
            export GH_TOKEN="$GITHUB_TOKEN"
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq length)
            if [ "$open" != "0" ]; then
              echo "PR for $BRANCH already open; branch updated."
              exit 0
            fi
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "$TITLE" \
              --body "Auto-generated PR to sync OpenAPI spec changes from the main repo and refresh generated public SDK models."
          '
